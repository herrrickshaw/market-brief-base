name: CI

# Lint + tests on every push and PR. Separate from daily-brief.yml, which is
# the scheduled production run and must keep its own --self-test gate.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime + dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Smoke (syntax, --help, offline self-test)
        run: bash tests/smoke.sh
      - name: Unit tests
        run: pytest
